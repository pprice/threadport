name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release commit
        if: ${{ steps.release.outputs['packages/react-threadport--release_created'] == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs['packages/react-threadport--sha'] }}

      - name: Setup Node.js
        if: ${{ steps.release.outputs['packages/react-threadport--release_created'] == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm
        if: ${{ steps.release.outputs['packages/react-threadport--release_created'] == 'true' }}
        run: corepack enable

      - name: Install dependencies
        if: ${{ steps.release.outputs['packages/react-threadport--release_created'] == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck package
        if: ${{ steps.release.outputs['packages/react-threadport--release_created'] == 'true' }}
        run: pnpm --filter @phipri/react-threadport typecheck

      - name: Test package
        if: ${{ steps.release.outputs['packages/react-threadport--release_created'] == 'true' }}
        run: pnpm --filter @phipri/react-threadport test

      - name: Publish to npm with provenance
        if: ${{ steps.release.outputs['packages/react-threadport--release_created'] == 'true' }}
        working-directory: packages/react-threadport
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
